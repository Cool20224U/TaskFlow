<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow — team task board</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>TaskFlow</h1>
    <span class="tagline">multi-tenant team task board</span>
    <button id="logout-btn" class="ghost" hidden>Log out</button>
  </header>

  <main>
    <section id="auth-view" hidden>
      <div class="card auth-card">
        <div class="tabs">
          <button class="tab active" data-tab="login">Log in</button>
          <button class="tab" data-tab="signup">New workspace</button>
          <button class="tab" data-tab="join">Join with invite</button>
        </div>

        <form id="login-form" class="auth-form">
          <label>Email <input type="email" name="email" required autocomplete="email"></label>
          <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
          <button type="submit">Log in</button>
        </form>

        <form id="signup-form" class="auth-form" hidden>
          <label>Name <input type="text" name="name" required autocomplete="name"></label>
          <label>Email <input type="email" name="email" required autocomplete="email"></label>
          <label>Password (min 8 chars) <input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
          <label>Workspace name <input type="text" name="orgName" placeholder="optional"></label>
          <button type="submit">Create workspace</button>
        </form>

        <form id="join-form" class="auth-form" hidden>
          <label>Name <input type="text" name="name" required autocomplete="name"></label>
          <label>Email <input type="email" name="email" required autocomplete="email"></label>
          <label>Password (min 8 chars) <input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
          <label>Invite code <input type="text" name="inviteCode" required></label>
          <button type="submit">Join workspace</button>
        </form>

        <p id="auth-error" class="error" role="alert"></p>
      </div>
    </section>

    <section id="app-view" hidden>
      <div class="org-bar card">
        Workspace: <strong id="org-name"></strong>
        <span class="invite">invite code: <code id="invite-code"></code></span>
      </div>

      <form id="project-form" class="card row">
        <input id="project-name" type="text" placeholder="New project name" required>
        <button type="submit">Add project</button>
      </form>

      <div id="projects"></div>
      <p id="app-error" class="error" role="alert"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
